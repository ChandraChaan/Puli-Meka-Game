name: Android APK

on:
  # Branches only: a release tag pushed by hand should not build a second copy.
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Optional: sign with your own key so new versions install over old
      # ones. Add the repository secrets described in the README; without
      # them the APK is signed with a throwaway debug key.
      - name: Set up release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name APK
        run: cp build/app/outputs/flutter-apk/app-release.apk puli-meka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: puli-meka-apk
          path: puli-meka.apk

      # Builds from main are the latest release; other branches publish a
      # pre-release for testing.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Puli Meka build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.IS_MAIN != 'true' }}
          make_latest: ${{ env.IS_MAIN }}
          files: puli-meka.apk
          body: |
            Download **puli-meka.apk** below and open it on your Android phone to install.
            You may need to allow "Install unknown apps" for your browser or file manager.
